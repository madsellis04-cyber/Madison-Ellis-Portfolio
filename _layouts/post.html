---
layout: default
---

<style>
  .article {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .post-heading {
    margin: 22px 0 36px;
  }

  .post-heading h1 {
    margin: 0;
  }

  .post-heading.has-portrait {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 30px;
  }

  .post-heading.has-portrait .featured-photo {
    flex: 0 0 34%;
    max-width: 240px;
    order: -1;
  }

  .post-heading.has-portrait .post-title {
    flex: 1;
    min-width: 0;
  }

  .featured-photo {
    text-align: center;
  }

  .featured-photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 340px;
    margin: 0 auto;
    border-radius: 12px;
  }

  .post-heading.has-landscape .featured-photo {
    margin-top: 28px;
  }

  @media (max-width: 600px) {
    .post-heading.has-portrait {
      flex-direction: column;
      align-items: stretch;
      gap: 24px;
    }

    .post-heading.has-portrait .featured-photo {
      order: 0;
      flex: none;
      max-width: 100%;
    }
  }
</style>

<main>
  <article class="article">

    <a class="back-link" href="{{ '/blog' | relative_url }}">
      ← Back to Blog
    </a>

    <p class="post-date">
      {{ page.date | date: "%B %-d, %Y" }}
    </p>

    <div class="post-heading" id="post-heading">

      <div class="post-title">
        <h1>{{ page.title | escape }}</h1>
      </div>

      {% if page.featured_image %}
        <div class="featured-photo">
          <img
            id="featured-image"
            src="{{ page.featured_image | escape }}"
            alt="{{ page.title | escape }}"
            loading="eager"
          >
        </div>
      {% endif %}

    </div>

    <div class="article-body">
      {{ content }}
    </div>

  </article>
</main>

{% if page.featured_image %}
<script>
  (function () {
    const image = document.getElementById("featured-image");
    const heading = document.getElementById("post-heading");

    if (!image || !heading) return;

    function updatePhotoLayout() {
      if (!image.naturalWidth || !image.naturalHeight) return;

      heading.classList.remove("has-portrait", "has-landscape");

      if (image.naturalHeight > image.naturalWidth) {
        heading.classList.add("has-portrait");
      } else {
        heading.classList.add("has-landscape");
      }
    }

    if (image.complete) updatePhotoLayout();

    image.addEventListener("load", updatePhotoLayout);
  })();
</script>
{% endif %}
