---
layout: default
---
<style>
  .article {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .post-heading {
    margin: 22px 0 36px;
  }

  .post-heading h1 {
    margin: 0;
  }

  .post-heading .post-date {
    margin: 18px 0 0;
  }

  .post-heading.has-portrait {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 30px;
  }

  .post-heading.has-portrait .featured-photo {
    flex: 0 0 auto;
    order: -1;
  }

  .post-heading.has-portrait .post-title {
    flex: 1;
    min-width: 0;
  }

  .featured-photo {
    text-align: center;
  }

  .featured-photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 380px;
    margin: 0 auto;
    border-radius: 12px;
  }

  .post-heading.has-landscape .featured-photo {
    margin-top: 28px;
  }

  /* Phone layout */
  @media (max-width: 600px) {
    .post-heading {
      margin: 18px 0 26px;
    }

    .post-heading.has-portrait {
      flex-direction: row;
      align-items: flex-start;
      gap: 14px;
    }

    .post-heading.has-portrait .featured-photo {
      order: -1;
      flex: 0 0 auto;
      max-width: 38%;
    }

    .post-heading.has-portrait .post-title {
      flex: 1;
      min-width: 0;
    }

    .post-heading.has-portrait h1 {
      font-size: clamp(1.25rem, 5vw, 1.75rem);
      line-height: 1.12;
      overflow-wrap: break-word;
    }

    .post-heading .post-date {
      margin-top: 12px;
      font-size: 0.65rem;
      line-height: 1.5;
    }

    .post-heading.has-portrait .featured-photo img {
      max-height: none;
      border-radius: 9px;
    }

    .post-heading.has-landscape h1 {
      font-size: clamp(2rem, 8vw, 3rem);
      line-height: 1.1;
    }

    .post-heading.has-landscape .featured-photo {
      margin-top: 22px;
    }

    .post-heading.has-landscape .featured-photo img {
      max-height: 340px;
    }
  }

  /* Very narrow phones */
  @media (max-width: 340px) {
    .post-heading.has-portrait {
      flex-direction: column;
      align-items: stretch;
    }

    .post-heading.has-portrait .featured-photo {
      order: 0;
      max-width: 100%;
    }

    .post-heading.has-portrait .featured-photo img {
      width: auto !important;
      height: auto !important;
      max-height: 300px;
    }

    .post-heading.has-portrait h1 {
      font-size: 2rem;
    }
  }
</style>

<main>
  <article class="article">

    <a class="back-link" href="{{ '/blog' | relative_url }}">
      ← Back to Blog
    </a>

    <div class="post-heading" id="post-heading">

      <div class="post-title" id="post-title">
        <h1>{{ page.title | escape }}</h1>

        <p class="post-date">
          {{ page.date | date: "%B %-d, %Y" }}
        </p>
      </div>

      {% if page.featured_image %}
        <div class="featured-photo" id="featured-photo">
          <img
            id="featured-image"
            src="{{ page.featured_image | escape }}"
            alt="{{ page.title | escape }}"
            loading="eager"
          >
        </div>
      {% endif %}

    </div>

    <div class="article-body">
      {{ content }}
    </div>

  </article>
</main>

{% if page.featured_image %}
<script>
  (function () {
    const image = document.getElementById("featured-image");
    const heading = document.getElementById("post-heading");
    const title = document.getElementById("post-title");
    const photo = document.getElementById("featured-photo");

    if (!image || !heading || !title || !photo) return;

    function updatePhotoLayout() {
      if (!image.naturalWidth || !image.naturalHeight) return;

      const isPortrait =
        image.naturalHeight > image.naturalWidth;

      const isMobile = window.innerWidth <= 600;
      const isExtraSmall = window.innerWidth <= 340;

      heading.classList.toggle("has-portrait", isPortrait);
      heading.classList.toggle("has-landscape", !isPortrait);

      image.style.width = "";
      image.style.height = "";
      photo.style.width = "";

      if (!isPortrait || isExtraSmall) return;

      const ratio =
        image.naturalWidth / image.naturalHeight;

      const availableWidth = heading.clientWidth;

      if (isMobile) {
        /*
         * Start with the largest permitted photo width.
         * This leaves enough room for the title.
         */
        const maxPhotoWidth = Math.min(
          availableWidth * 0.38,
          155
        );

        photo.style.width = maxPhotoWidth + "px";

        /*
         * Measure the title and date after the
         * text column has been sized.
         */
        const titleHeight =
          title.getBoundingClientRect().height;

        /*
         * Match the photo height to the title/date,
         * without exceeding the available width.
         */
        const targetWidth = titleHeight * ratio;
        const finalWidth = Math.min(
          targetWidth,
          maxPhotoWidth
        );

        photo.style.width = finalWidth + "px";
        image.style.width = finalWidth + "px";
        image.style.height = "auto";

        return;
      }

      /*
       * Desktop layout: unchanged.
       */
      const maxPhotoWidth = Math.min(
        280,
        availableWidth * 0.38
      );

      photo.style.width = maxPhotoWidth + "px";

      const titleHeight =
        title.getBoundingClientRect().height;

      const targetHeight = Math.min(
        titleHeight,
        460
      );

      const targetWidth = targetHeight * ratio;

      const finalWidth = Math.min(
        targetWidth,
        maxPhotoWidth
      );

      const finalHeight = finalWidth / ratio;

      photo.style.width = finalWidth + "px";
      image.style.width = finalWidth + "px";
      image.style.height = finalHeight + "px";
    }

    if (image.complete) {
      updatePhotoLayout();
    }

    image.addEventListener("load", updatePhotoLayout);
    window.addEventListener("resize", updatePhotoLayout);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updatePhotoLayout);
    }
  })();
</script>
{% endif %}
