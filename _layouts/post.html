---
layout: default
---
<style>
  .article {
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
  }

  .post-heading {
    margin: 22px 0 36px;
  }

  .post-heading h1 {
    margin: 0;
  }

  .post-heading .post-date {
    margin: 18px 0 0;
  }

  .post-heading.has-portrait {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 30px;
  }

  .post-heading.has-portrait .featured-photo {
    flex: 0 0 auto;
    order: -1;
  }

  .post-heading.has-portrait .post-title {
    flex: 1;
    min-width: 0;
  }

  .featured-photo {
    text-align: center;
  }

  .featured-photo img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 380px;
    margin: 0 auto;
    border-radius: 12px;
  }

  .post-heading.has-landscape .featured-photo {
    margin-top: 28px;
  }

  @media (max-width: 600px) {
    .post-heading.has-portrait {
      flex-direction: column;
      align-items: stretch;
      gap: 24px;
    }

    .post-heading.has-portrait .featured-photo {
      order: 0;
      flex: none;
      max-width: 100%;
    }

    .post-heading.has-portrait .featured-photo img {
      height: auto !important;
      width: auto !important;
      max-height: 380px;
    }
  }
</style>

<main>
  <article class="article">

    <a class="back-link" href="{{ '/blog' | relative_url }}">
      ← Back to Blog
    </a>

    <div class="post-heading" id="post-heading">

      <div class="post-title" id="post-title">
        <h1>{{ page.title | escape }}</h1>

        <p class="post-date">
          {{ page.date | date: "%B %-d, %Y" }}
        </p>
      </div>

      {% if page.featured_image %}
        <div class="featured-photo" id="featured-photo">
          <img
            id="featured-image"
            src="{{ page.featured_image | escape }}"
            alt="{{ page.title | escape }}"
            loading="eager"
          >
        </div>
      {% endif %}

    </div>

    <div class="article-body">
      {{ content }}
    </div>

  </article>
</main>

{% if page.featured_image %}
<script>
  (function () {
    const image = document.getElementById("featured-image");
    const heading = document.getElementById("post-heading");
    const title = document.getElementById("post-title");
    const photo = document.getElementById("featured-photo");

    if (!image || !heading || !title || !photo) return;

    function updatePhotoLayout() {
      if (!image.naturalWidth || !image.naturalHeight) return;

      const isPortrait = image.naturalHeight > image.naturalWidth;
      const isMobile = window.innerWidth <= 600;

      heading.classList.toggle("has-portrait", isPortrait);
      heading.classList.toggle("has-landscape", !isPortrait);

      image.style.width = "";
      image.style.height = "";
      photo.style.width = "";

      if (!isPortrait || isMobile) return;

      const ratio = image.naturalWidth / image.naturalHeight;

      /*
       * Begin with a modest photo width so the title
       * has plenty of room to wrap naturally.
       */
      const availableWidth = heading.clientWidth;
      const maxPhotoWidth = Math.min(280, availableWidth * 0.38);

      photo.style.width = maxPhotoWidth + "px";

      /*
       * Measure the title at its final column width.
       * Then size the photo proportionally to its height.
       */
      const titleHeight = title.getBoundingClientRect().height;
      const targetHeight = Math.min(titleHeight, 460);
      const targetWidth = targetHeight * ratio;

      const finalWidth = Math.min(targetWidth, maxPhotoWidth);
      const finalHeight = finalWidth / ratio;

      photo.style.width = finalWidth + "px";
      image.style.width = finalWidth + "px";
      image.style.height = finalHeight + "px";
    }

    if (image.complete) {
      updatePhotoLayout();
    }

    image.addEventListener("load", updatePhotoLayout);
    window.addEventListener("resize", updatePhotoLayout);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updatePhotoLayout);
    }
  })();
</script>
{% endif %}
